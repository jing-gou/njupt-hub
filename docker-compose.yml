version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: njupt-hub-db-1
    restart: always
    # 解决 MySQL 8.0 身份验证兼容性问题
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  server:
    image: njupt-hub-server
    container_name: njupt-hub-server-1
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    environment:
      # 直接引用 .env 中的连接字符串
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "3001:3000"
    depends_on:
      - db

  client:
    image: njupt-hub-client
    container_name: njupt-hub-client-1
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3002:80"
    depends_on:
      - server

  umami-db:
    image: postgres:16-alpine
    container_name: njupt-hub-umami-db-1
    restart: always
    environment:
      POSTGRES_DB: ${UMAMI_DB_NAME:-umami}
      POSTGRES_USER: ${UMAMI_DB_USER:-umami}
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami_db_data:/var/lib/postgresql/data

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: njupt-hub-umami-1
    restart: always
    environment:
      DATABASE_URL: postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD}@umami-db:5432/${UMAMI_DB_NAME:-umami}
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
    ports:
      - "3003:3000"
    depends_on:
      - umami-db

volumes:
  mysql_data:
  umami_db_data: