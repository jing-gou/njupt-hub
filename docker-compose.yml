version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: njupt-hub-db-1
    restart: always
    # 解决 MySQL 8.0 身份验证兼容性问题
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  server:
    image: njupt-hub-server
    container_name: njupt-hub-server-1
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    environment:
      # 直接引用 .env 中的连接字符串
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "3001:3000"
    depends_on:
      - db

  client:
    image: njupt-hub-client
    container_name: njupt-hub-client-1
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID}
    restart: always
    ports:
      - "3002:80"
    depends_on:
      - server

  umami:
    image: ghcr.io/umami-software/umami:mysql-latest
    container_name: njupt-hub-umami-1
    restart: always
    environment:
      DATABASE_URL: mysql://${UMAMI_DB_USER:-${DB_USER}}:${UMAMI_DB_PASSWORD:-${DB_PASSWORD}}@db:3306/${UMAMI_DB_NAME:-${DB_NAME}}
      DATABASE_TYPE: mysql
      APP_SECRET: ${UMAMI_APP_SECRET}
    ports:
      - "3003:3000"
    depends_on:
      - db

  webdav:
    image: bytemark/webdav
    restart: always
    ports:
      - "3004:80"
    environment:
      - AUTH_TYPE=Digest
      - USERNAME=${WEBDAV_USERNAME}
      - PASSWORD=${WEBDAV_PASSWORD}
    volumes:
      - webdav_data:/var/lib/dav
volumes:
  mysql_data:
  webdav_data: