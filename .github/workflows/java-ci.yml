name: Java CI

on:
  pull_request:
    branches: [java-backend]
  push:
    branches: [java-backend]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        working-directory: server-java
        run: ./mvnw -B verify
